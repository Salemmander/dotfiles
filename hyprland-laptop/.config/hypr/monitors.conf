# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale
# You must relaunch Hyprland after changing any envs (use Super+Esc, then Relaunch)

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,2
monitor=,preferred,auto,auto

# auto disable laptop screen when plugged into monitors in clamshell
bindl = ,switch:on:Lid Switch,exec,~/.config/hypr/scripts/lid-close.sh
bindl = ,switch:off:Lid Switch,exec,~/.config/hypr/scripts/lid-open.sh

# Pin workspaces to monitors by description (survives port reshuffles).
# Odd workspaces -> left (VG270), even workspaces -> right (VG272U).
# If a monitor is unplugged, its workspaces fall through to whatever is present.
workspace = 1, monitor:desc:Acer Technologies VG270 0x0100ACAC, default:true
workspace = 3, monitor:desc:Acer Technologies VG270 0x0100ACAC
workspace = 5, monitor:desc:Acer Technologies VG270 0x0100ACAC
workspace = 7, monitor:desc:Acer Technologies VG270 0x0100ACAC
workspace = 9, monitor:desc:Acer Technologies VG270 0x0100ACAC
workspace = 2, monitor:desc:Acer Technologies VG272U TG0AA001854D, default:true
workspace = 4, monitor:desc:Acer Technologies VG272U TG0AA001854D
workspace = 6, monitor:desc:Acer Technologies VG272U TG0AA001854D
workspace = 8, monitor:desc:Acer Technologies VG272U TG0AA001854D
workspace = 10, monitor:desc:Acer Technologies VG272U TG0AA001854D
