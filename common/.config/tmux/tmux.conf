# Keybind reference: see ~/.config/tmux/tmux-reference.txt (Alt+/ to view)

# Use zsh in tmux
set-option -g default-shell /bin/zsh

# Set Prefix to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Pane Splits (Alt+d vertical, Alt+Shift+d horizontal)
bind -n M-d split-window -h
bind -n M-D split-window -v

# Pane Navigation (Alt+h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane Resizing (Ctrl+h/j/k/l, repeatable)
bind -rn C-h resize-pane -L 5
bind -rn C-j resize-pane -D 5
bind -rn C-k resize-pane -U 5
bind -rn C-l resize-pane -R 5

# Window Switching (Alt+Shift+h/l)
bind -n M-H previous-window
bind -n M-L next-window

# New Window / Close Pane / Zoom
bind -n M-n new-window
bind -n M-w kill-pane
bind -n M-f resize-pane -Z

# Quick Reference Popup (Alt+/)
bind -n M-/ display-popup -w 54 -h 30 -E "less ~/.config/tmux/tmux-reference.txt"

# Vim Style Copy Mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Window/Pane Numbering starts at 1 not 0
set -g base-index 1
set -g pane-base-index 1

# Mouse Support
set -g mouse on

# Terminal capabilities (required for Ghostty detection + truecolor in tools like Grok)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Pass through environment variables from the outer terminal (Ghostty)
# so tools like Grok can properly detect the terminal for theming and background handling
set -g update-environment "TERM TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# Extended keys support (recommended by /terminal-check for modifier keys)
set -g extended-keys on

# Allow OSC escape sequences (hyperlinks, clipboard) to pass through to terminal
set -g allow-passthrough on
set -as terminal-features ',xterm-ghostty:hyperlinks'
set -as terminal-features ',tmux-256color:hyperlinks'

# Pass cursor shape changes through to the terminal (bar=6, block=2)
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'

# -------------------------------------------
#               STATUS BAR
# -------------------------------------------

# Transparent background, blends with terminal
set -g status-style "bg=default,fg=#53685B"
set -g status-left "#[fg=#549e6a]#S "
set -g status-right ""
set -g status-left-length 20
set -g status-justify absolute-centre

# Window tabs: muted by default, highlighted when active
set -g window-status-format "#[fg=#53685B] #I:#W "
set -g window-status-current-format "#[fg=#C1C497] #I:#W "

# Pane borders
set -g pane-border-style "fg=#23372B"
set -g pane-active-border-style "fg=#549e6a"
set -g pane-border-indicators off
set -g pane-border-status top
# Workaround: Claude Code sets process title to its version number
set -g pane-border-format "#{?pane_active,#[fg=#549e6a] #{s/^[0-9][0-9.]*$/claude/:pane_current_command} ,}"

# Dim inactive panes
set -g window-style "fg=#888888"
set -g window-active-style "fg=terminal"

# Command prompt / messages
set -g message-style "bg=#23372B,fg=#C1C497"


# -------------------------------------------
#               TPM PLUGINS
# -------------------------------------------

# List plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
