source-file ~/.config/tmux/tmux.options.conf
source-file ~/.config/tmux/tmux.keys.conf
source-file ~/.config/tmux/tmux.terminal.conf
source-file ~/.config/tmux/tmux.status.conf
source-file ~/.config/tmux/tmux.plugins.conf

# Enable OSC 52 clipboard forwarding for remote Neovim yanks.
set -as terminal-features ",*:clipboard"
