# Keybind reference: see ~/.config/tmux/tmux-reference.txt (Alt+/ to view)

# Use zsh in tmux
set-option -g default-shell /bin/zsh

# Set Prefix to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Pane Splits (Alt+d vertical, Alt+Shift+d horizontal)
bind -n M-d split-window -h
bind -n M-D split-window -v

# Pane Navigation (Alt+h/j/k/l)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane Resizing (Ctrl+h/j/k/l, repeatable)
bind -rn C-h resize-pane -L 5
bind -rn C-j resize-pane -D 5
bind -rn C-k resize-pane -U 5
bind -rn C-l resize-pane -R 5

# Window Switching (Alt+Shift+h/l)
bind -n M-H previous-window
bind -n M-L next-window

# New Window / Close Pane / Zoom
bind -n M-n new-window
bind -n M-w kill-pane
bind -n M-f resize-pane -Z

# Quick Reference Popup (Alt+/)
bind -n M-/ display-popup -w 54 -h 30 -E "less ~/.config/tmux/tmux-reference.txt"

# Vim Style Copy Mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Window/Pane Numbering starts at 1 not 0
set -g base-index 1
set -g pane-base-index 1

# Mouse Support
set -g mouse on

# -------------------------------------------
#               STATUS BAR
# -------------------------------------------

# Transparent background, blends with terminal
set -g status-style "bg=default,fg=#53685B"
set -g status-left "#[fg=#549e6a]#S "
set -g status-right ""
set -g status-left-length 20
set -g status-justify absolute-centre

# Window tabs: muted by default, highlighted when active
set -g window-status-format "#[fg=#53685B] #I:#W "
set -g window-status-current-format "#[fg=#C1C497] #I:#W "

# Pane borders
set -g pane-border-style "fg=#23372B"
set -g pane-active-border-style "fg=#23372B"

# Dim inactive panes
set -g window-style "fg=#888888"
set -g window-active-style "fg=terminal"

# Command prompt / messages
set -g message-style "bg=#23372B,fg=#C1C497"


# -------------------------------------------
#               TPM PLUGINS
# -------------------------------------------

# List plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
